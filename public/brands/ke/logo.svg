<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="100%" height="100%">
  <defs>
    <linearGradient id="keGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="keAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  
  <!-- Architectural Accent Motif -->
  <rect x="12" y="15" width="5" height="40" rx="2.5" fill="url(#keAccent)" />
  <rect x="22" y="24" width="5" height="31" rx="2.5" fill="url(#keAccent)" opacity="0.65" />
  
  <!-- "KE" Bold Geometric Mark -->
  <text x="36" y="49" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" fill="url(#keGrad)">KE</text>
  
  <!-- Divider -->
  <line x1="102" y1="18" x2="102" y2="52" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Sub-label "OUTDOOR DESIGN" -->
  <text x="114" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="2.8" fill="#0f172a">OUTDOOR</text>
  <text x="114" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.5" fill="#64748b">DESIGN</text>
</svg>
